<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">轨</div><div><h1>场段图编辑器</h1><span>Yard Map Editor</span></div></div>
    <div class="title"><b id="viewTitle">示例线 · 示例车辆段 · 编辑模式</b><span id="saveState">本地草稿</span></div>
    <div class="top-actions">
      <button id="undoBtn" title="撤销最近一次编辑">撤销</button><button id="redoBtn" title="恢复刚撤销的编辑">重做</button>
      <button id="saveLocal" title="保存当前编辑草稿">保存草稿</button><button class="primary" id="publishAndRun" title="发布当前版本并在新页签打开运行作业页">发布并打开运行页</button>
    </div>
  </header>
  <main class="layout">
    <aside class="panel">
      <div class="panel-head">配置与工具</div>
      <div class="panel-body">
        <section class="block">
          <h3>项目</h3>
          <div class="grid2">
            <div><label>线路</label><select id="metaLine"></select></div><div><label>场段</label><select id="metaYard"></select></div>
            <div><label>图纸版本</label><input id="metaVersion"></div><div><label>坐标吸附</label><select id="snapSize"><option value="0" selected>自由定位</option><option value="0.1">0.1</option><option value="0.5">0.5</option><option value="1">1</option><option value="5">5</option><option value="10">10</option><option value="20">20</option></select></div>
            <div class="full"><button id="openDictionary" class="dictionary-entry"><span><b>数据字典</b></span><span class="entry-command">配置</span></button></div>
          </div>
        </section>
        <section class="block">
          <h3>绘制工具</h3>
          <div class="tool-grid" id="toolGrid">
            <button data-tool="select" class="active">选择/平移画布</button><button data-tool="boxSelect">框选对象</button>
            <button data-tool="track">绘制股道</button><button data-tool="point">编辑点位</button>
            <button data-tool="move">拖动对象</button><button data-tool="switch">放置道岔</button>
            <button data-tool="signal">放置信号机</button><button data-tool="area">绘制区域</button>
            <button data-tool="line">绘制线段</button><button data-tool="textH">横向文本</button>
            <button data-tool="textV">竖向文本</button><button data-tool="vehicle">放置车辆</button>
            <button data-tool="connect">连接关系</button>
          </div>
          <div class="section-actions"><button id="finishDraw" class="primary">完成股道</button><button id="cancelDraw">取消临时绘制</button></div>
        </section>
        <section class="block" id="defaultStyleBlock">
          <h3>新建元素样式</h3>
          <div class="style-target"><span id="styleTargetName">股道</span><i id="styleTargetSwatch" class="style-swatch"></i></div>
          <div class="grid2"><div class="full"><label>RGB颜色</label><div class="color-control"><input type="color" id="defaultColor"><span class="rgb-value" id="defaultRgb"></span></div></div><div><label>透明度</label><select id="defaultOpacity"></select></div><div><label>宽度/字重</label><input id="defaultWidth" type="number" min="1" max="900" step="0.5"></div><div class="full text-style-fields" id="defaultTextStyle"><div><label>字体</label><select id="defaultFontFamily"><option>Microsoft YaHei</option><option>SimSun</option><option>SimHei</option><option>Arial</option></select></div><div><label>字号（px）</label><input id="defaultFontSize" type="number" min="6" max="120" step="1"></div></div></div>
        </section>
        <section class="block">
          <h3>图层</h3><div id="layerList"></div>
        </section>
        <section class="block">
          <h3>底图与数据</h3>
          <input type="file" id="underlayFile" accept="application/pdf,image/*,.svg,.dwg,.dxf" style="display:none"><input type="file" id="importFile" accept="application/json,.json" style="display:none">
          <div class="tool-grid">
            <button id="importUnderlay">导入PDF/图片</button><button id="toggleUnderlay">显示/隐藏底图</button>
            <button id="exportJson">导出JSON</button><button id="importJson">导入JSON</button>
            <button id="newBlank">新建空白图</button><button id="clearAll" class="danger">清空</button>
          </div>
          <div id="underlayInfo" class="hint" style="margin-top:8px">未导入底图</div>
        </section>
      </div>
    </aside>
    <section class="panel canvas-panel">
      <div class="canvas-toolbar">
        <div class="toolbar-left"><span class="tag" id="currentTool">选择</span><span class="tag" id="constraintState">Shift 直线约束</span><button id="alignToggle" class="active">对齐参考：开</button><button id="gridConfig">网格设置</button><span class="hint" id="drawHint">点击对象查看或编辑属性</span></div>
        <div class="toolbar-right"><span id="pointerCoord" class="tag">X -- · Y --</span><button id="zoomOut">-</button><span id="zoomText" class="tag">100%</span><button id="zoomIn">+</button><button id="fitView">适配</button></div>
      </div>
      <div class="canvas-wrap">
        <div class="grid-bg"></div><div class="loading-cover" id="loadingCover">正在解析高清底图...</div>
        <div class="runtime-map-legend" id="runtimeMapLegend" style="display:none"></div>
        <svg id="yardSvg" viewBox="0 0 1600 900" aria-label="场段图编辑画布">
          <g id="gridLayer"></g><g id="underlayLayer"></g><g id="areaLayer"></g><g id="lineLayer"></g><g id="trackLayer"></g><g id="switchLayer"></g><g id="signalLayer"></g><g id="vehicleLayer"></g><g id="textLayer"></g><g id="runtimeLayer"></g><g id="guideLayer"></g><g id="editLayer"></g><g id="draftLayer"></g>
        </svg>
      </div>
      <div class="statusbar"><span id="statusText">对象 0 个</span><span>选择模式可按住左键拖动画布；绘制股道时按住 Shift 可约束方向。</span></div>
    </section>
    <aside class="panel">
      <div class="panel-head">属性与对象<span class="link" id="openJson">查看数据></span></div>
      <div class="panel-body">
        <section class="block"><h3>当前对象</h3><div id="propertyPanel" class="hint">未选择对象。</div></section>
        <section class="block"><h3>校验提示</h3><div id="checkList"></div></section>
        <section class="block"><h3>对象列表</h3><div class="object-filter"><input id="objectSearch" placeholder="搜索编号、名称"><select id="objectTypeFilter"><option value="all">全部</option><option value="track">股道</option><option value="switch">道岔</option><option value="signal">信号机</option><option value="area">区域</option><option value="line">线段</option><option value="text">文本</option><option value="vehicle">车辆</option></select></div><div id="objectList"></div></section>
      </div>
    </aside>
  </main>
</div>
<div class="modal-mask" id="modalMask"><div class="modal"><div class="modal-head"><span id="modalTitle">详情</span><span class="close" id="modalClose">×</span></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* v17：正线发布页与对象样式收口 */
(() => {
  const V17_MAINLINE_PUBLISHED = 'line-yard-detail-published-v1';
  const params = new URLSearchParams(location.search);
  const v17RuntimeMainline = isRuntime && params.get('diagram') === 'mainline';
  const v17IsMainlineEdit = () => !isRuntime && state.project?.diagramType === 'mainline';
  const v17LineTypes = new Set(['underground','elevated','assist','power','catenary','crossover','turnback']);

  function v17Rgb(value) { return hexRgb(normalizeColor(value) || '#dff8ff'); }
  function v17EnhanceColors(root=document) {
    if (isRuntime || !root) return;
    root.querySelectorAll('input[type="color"]').forEach(input => {
      if (input.closest('.color-control')) return;
      const holder=document.createElement('div'); holder.className='color-control';
      input.parentNode.insertBefore(holder,input); holder.appendChild(input);
      const readout=document.createElement('span'); readout.className='rgb-value'; readout.textContent=v17Rgb(input.value); holder.appendChild(readout);
      input.addEventListener('input',()=>{readout.textContent=v17Rgb(input.value);rememberColor(input.value);renderRecentColorControls(holder.parentElement||document);});
    });
    renderRecentColorControls(root);
  }

  /* 正线发布写入专用快照，并把新窗口明确路由到正线发布页。 */
  const v17BasePublish = publishMap;
  publishMap = function(openRuntime=false) {
    if (!v17IsMainlineEdit()) return v17BasePublish(openRuntime);
    const snapshot=serializableState();
    snapshot.project={...(snapshot.project||{}),diagramType:'mainline',version:'v17'};
    snapshot.publication={publishedAt:new Date().toISOString(),sourceVersion:'v17',objectCount:(snapshot.mainline?.placed||[]).length};
    localStorage.setItem(V17_MAINLINE_PUBLISHED,JSON.stringify(snapshot));
    state.dirty=false;
    try { localStorage.setItem(storageKey,JSON.stringify(serializableState())); } catch (_) {}
    toast('正线运行版本已发布');
    if (openRuntime) {
      const u=new URL(location.href.split('?')[0]);
      u.searchParams.set('runtime','1');u.searchParams.set('diagram','mainline');
      u.searchParams.set('lineId',state.project.lineId||'');
      window.open(u.toString(),'_blank');

  };

  function v17RuntimeLayers() {
    const cfg=state.mainline?.v16 || {};
    const source=Array.isArray(cfg.layers)&&cfg.layers.length ? cfg.layers : [
      {id:'ML16-BASE',code:'BASE',name:'线路基础',visible:true,runtime:true,sort:1},
      {id:'ML16-EQUIP',code:'EQUIP',name:'信号与设备',visible:true,runtime:true,sort:2},

    state.mainline.v17RuntimeLayers=state.mainline.v17RuntimeLayers||{};

  function v17RuntimeObjects() { return state.mainline?.placed||[]; }
  function v17DrawRuntimeObject(object) {

      const w=Number(object.boxWidth||118),h=Number(object.boxHeight||44),name=object.name||object.code||'车站';
      group.appendChild(v17Element('rect',{x:Number(object.x)-w/2,y:Number(object.y)-h/2,width:w,height:h,fill:'rgba(3,17,29,.74)',stroke:color,'stroke-width':object.width||2,rx:3,'vector-effect':'non-scaling-stroke'}));
      group.appendChild(v17Element('text',{x:object.x,y:Number(object.y)+Number(object.fontSize||14)*.34,fill:color,'font-family':object.fontFamily||'Microsoft YaHei','font-size':object.fontSize||14,'font-weight':object.fontWeight||600,'text-anchor':'middle','stroke':'none','paint-order':'normal'},name));
      return;

    if(object.type==='switch'){
      const s=Number(object.iconSize||18); group.appendChild(v17Element('path',{d:`M ${object.x-s} ${object.y-s} L ${object.x+s} ${object.y+s} M ${object.x-s} ${object.y+s} L ${object.x+s} ${object.y-s}`,stroke:color,'stroke-width':object.width||2,fill:'none','vector-effect':'non-scaling-stroke'}));
    } else if(object.type==='signal') {
      const s=Number(object.iconSize||9); group.appendChild(v17Element('circle',{cx:object.x-s*.7,cy:object.y,r:s,fill:'none',stroke:color,'stroke-width':object.width||1,'vector-effect':'non-scaling-stroke'}));group.appendChild(v17Element('circle',{cx:Number(object.x)+s*.7,cy:object.y,r:s,fill:color,stroke:color,'stroke-width':object.width||1,'vector-effect':'non-scaling-stroke'}));
    } else {
      const s=Number(object.iconSize||22); group.appendChild(v17Element('rect',{x:object.x-s/2,y:object.y-s/2,width:s,height:s,fill:'rgba(3,17,29,.76)',stroke:color,'stroke-width':object.width||2,'vector-effect':'non-scaling-stroke'}));
    }
    if(object.name||object.code)group.appendChild(v17Element('text',{x:object.x,y:Number(object.y)-(Number(object.iconSize||22)/2+7),fill:color,'font-size':object.fontSize||11,'font-family':object.fontFamily||'Microsoft YaHei','text-anchor':'middle','stroke':'none'},object.name||object.code));
  }
  function v17RuntimeStations() {

    return (state.dictionaries.mainlineStations||[]).filter(item=>!item.lineId||item.lineId===id).slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
  }
  function v17DrawRuntimeOverview() {
    let overview=document.getElementById('mainlineOverview'); if(!overview)return;
    const stations=v17RuntimeStations(), W=8000,H=1080,pad=170,y=780, span=W-pad*2;
    overview.innerHTML='';overview.setAttribute('viewBox',`0 0 ${W} ${H}`);overview.style.display='block';
    if(!stations.length)return;
    overview.appendChild(v17Element('line',{x1:pad,y1:y,x2:W-pad,y2:y,stroke:'#78b4c8','stroke-width':12,'stroke-linecap':'round'}));
    stations.forEach((station,index)=>{
      const x=stations.length===1?W/2:pad+index*span/(stations.length-1),chars=Array.from(station.name||''),font=Math.max(52,Math.min(96,Math.round(560/Math.max(2,chars.length))));
      const target=v17RuntimeObjects().find(item=>item.type==='station'&&item.stationId===station.id);
      const current=target&&state.viewport.x<=target.x&&target.x<=state.viewport.x+state.viewport.w;
      const hit=v17Element('rect',{x:x-100,y:60,width:200,height:H-110,fill:'transparent',cursor:'pointer'});
      const group=v17Element('g',{}),first=y-120-Math.max(0,chars.length-1)*font*.9;
      chars.forEach((ch,n)=>group.appendChild(v17Element('text',{x,y:first+n*font*.9,fill:current?'#ffd452':'#d7f3fb','font-size':font,'font-family':'Microsoft YaHei','font-weight':'700','text-anchor':'middle','stroke':'#061a28','stroke-width':10,'paint-order':'stroke'},ch)));
      group.appendChild(v17Element('circle',{cx:x,cy:y,r:current?40:28,fill:current?'#ffd452':'#0d4964',stroke:current?'#fff5bf':'#9bdff2','stroke-width':8}));
      const locate=()=>{if(!target)return;state.viewport.x=Math.max(0,target.x-state.viewport.w/2);state.viewport.y=Math.max(0,target.y-state.viewport.h/2);v17RenderRuntimeMainline();};
      hit.addEventListener('click',locate);group.addEventListener('click',locate);overview.append(hit,group);
    });
  }
  function v17RenderRuntimeMainline() {
    if(!v17RuntimeMainline)return;
    ['area','line','track','switch','signal','vehicle','text','runtime','guide','edit','draft'].forEach(key=>{if(layerEls[key])layerEls[key].innerHTML='';});
    layerEls.underlay.innerHTML='';layerEls.grid.innerHTML='';
    setViewBox(state.viewport);v17RuntimeObjects().forEach(v17DrawRuntimeObject);v17DrawRuntimeOverview();
    document.getElementById('viewTitle').textContent=`${state.project.line||'线路'} · 正线综合详图 · 运行发布页`;
    document.getElementById('saveState').textContent=clockText();document.getElementById('statusText').textContent='';
  }
  function v17InstallRuntimeDrawer() {
    if(!v17RuntimeMainline||document.getElementById('v17RuntimeDrawer'))return;
    document.body.classList.add('v17-mainline-runtime');
    const drawer=document.createElement('aside');drawer.id='v17RuntimeDrawer';drawer.innerHTML='<div class="v17-drawer-head"><b>图层查看</b><button type="button" id="v17CloseDrawer">×</button></div><div class="v17-drawer-note">按图层控制正线对象显示。</div><div id="v17RuntimeLayerRows"></div>';
    const toggle=document.createElement('button');toggle.id='v17RuntimeDrawerToggle';toggle.type='button';toggle.textContent='图层';document.body.append(toggle,drawer);
    const renderRows=()=>{const root=document.getElementById('v17RuntimeLayerRows');if(!root)return;root.innerHTML=v17RuntimeLayers().map(layer=>`<label class="v17-runtime-layer"><input type="checkbox" data-v17-layer="${layer.id}" ${state.mainline.v17RuntimeLayers[layer.id]!==false?'checked':''}><span>${escapeHtml(layer.code)} · ${escapeHtml(layer.name)}</span></label>`).join('');root.querySelectorAll('[data-v17-layer]').forEach(box=>box.onchange=()=>{state.mainline.v17RuntimeLayers[box.dataset.v17Layer]=box.checked;v17RenderRuntimeMainline();});};
    toggle.onclick=()=>{drawer.classList.toggle('open');renderRows();};drawer.querySelector('#v17CloseDrawer').onclick=()=>drawer.classList.remove('open');renderRows();
  }
  function v17StartRuntimeMainline() {
    const raw=localStorage.getItem(V17_MAINLINE_PUBLISHED);if(!raw){toast('未找到正线发布版本');return;}
    try{state=normalizeState(JSON.parse(raw));}catch(_){toast('正线发布数据无法读取');return;}
    state.project.diagramType='mainline';state.mainline=state.mainline||{placed:[]};
    const panel=document.querySelector('.canvas-panel');if(panel)panel.style.gridTemplateRows='42px minmax(0,1fr) 0';

    document.querySelector('.layout').style.gridTemplateColumns='minmax(0,1fr)';
    const overview=document.getElementById('mainlineOverview');
    if(overview)document.querySelector('.canvas-wrap')?.appendChild(overview);
    v17InstallRuntimeDrawer();v17RenderRuntimeMainline();
    if(!window.__v17Clock){window.__v17Clock=setInterval(()=>{if(v17RuntimeMainline&&document.getElementById('saveState'))document.getElementById('saveState').textContent=clockText();},1000);}
  }

  const v17BaseRender=render;
  render=function(){v17BaseRender();if(v17RuntimeMainline)v17RenderRuntimeMainline();else if(v17IsMainlineEdit)v17EnhanceColors(document);};
  const v17BaseOpenModal=openModal;
  openModal=function(title,html,wide=false){const result=v17BaseOpenModal(title,html,wide);setTimeout(()=>v17EnhanceColors(document.getElementById('modalBody')),0);return result;};
  document.addEventListener('input',event=>{const input=event.target.closest('input[type="color"]');if(!input)return;rememberColor(input.value);const output=input.closest('.color-control')?.querySelector('.rgb-value');if(output)output.textContent=v17Rgb(input.value);},true);
  if(v17RuntimeMainline)setTimeout(v17StartRuntimeMainline,0);else setTimeout(()=>v17EnhanceColors(document),0);

  const style=document.createElement('style');style.textContent=`
    .v17-mainline-runtime .layout{grid-template-columns:minmax(0,1fr)!important}.v17-mainline-runtime .canvas-panel{grid-template-rows:42px minmax(0,1fr) 0!important}.v17-mainline-runtime .canvas-wrap{display:grid;grid-template-rows:minmax(0,1fr) 138px;overflow:hidden}.v17-mainline-runtime #yardSvg{grid-row:1;min-height:0}.v17-mainline-runtime #mainlineOverview{grid-row:2;display:block!important;height:138px!important;min-height:138px!important;background:#041826;border-top:1px solid rgba(74,204,255,.3);cursor:pointer}.v17-mainline-runtime #v16MainScroll,.v17-mainline-runtime #runtimeMapLegend,.v17-mainline-runtime .top-actions{display:none!important}.v17-mainline-runtime .canvas-toolbar{padding-left:64px}.v17-mainline-runtime #drawHint,.v17-mainline-runtime #constraintState,.v17-mainline-runtime #alignToggle,.v17-mainline-runtime #gridConfig{display:none!important}
    #v17RuntimeDrawerToggle{position:fixed;z-index:26;left:12px;top:64px;background:#0b5279;border-color:#54d1fa;box-shadow:0 5px 18px rgba(0,0,0,.28)}#v17RuntimeDrawer{position:fixed;z-index:27;left:0;top:54px;bottom:0;width:284px;padding:14px;background:#041826;border-right:1px solid rgba(74,204,255,.45);box-shadow:12px 0 36px rgba(0,0,0,.34);transform:translateX(-102%);transition:transform .18s ease;overflow:auto}#v17RuntimeDrawer.open{transform:translateX(0)}.v17-drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid rgba(74,204,255,.2);font-size:15px}.v17-drawer-head button{padding:2px 9px;font-size:20px}.v17-drawer-note{padding:11px 0;color:#9fc8d8;font-size:12px}.v17-runtime-layer{display:flex;align-items:center;gap:8px;padding:9px 6px;border-top:1px solid rgba(74,204,255,.13);color:#dff8ff;cursor:pointer}.v17-runtime-layer input{width:auto}
    .color-control input[type=color]{appearance:auto}.color-control .recent-colors{grid-column:1/-1}.mainline-mode .color-control{margin-top:2px}
  `;document.head.appendChild(style);
  document.title='线路/场段详图编辑器 v17';
})();

<script>
/* v18：正线复制粘贴与运行页大屏布局加固 */
(() => {
  let v18MainlineSelectedId='';
  let v18MainlineClipboard=[];
  let v18MainlinePoint={x:140,y:140};
  const v18MainlineEditor=()=>!isRuntime&&state.project?.diagramType==='mainline';
  const v18Editing=()=>['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)||document.activeElement?.isContentEditable;
  const v18NewId=()=>`ML18-${Date.now()}-${Math.random().toString(16).slice(2,7)}`;

  function v18PaintMainlineSelection(){
    document.querySelectorAll('[data-v2-mainline]').forEach(node=>node.classList.toggle('v18-mainline-selected',node.dataset.v2Mainline===v18MainlineSelectedId));
  }
  function v18TrackPointer(event){
    if(!v18MainlineEditor())return;
    const svg=document.getElementById('yardSvg');if(!svg||!svg.contains(event.target))return;
    const hit=event.target.closest('[data-v2-mainline]');
    if(hit){v18MainlineSelectedId=hit.dataset.v2Mainline;requestAnimationFrame(v18PaintMainlineSelection);return;}
    try{v18MainlinePoint=pt(event,false)}catch(_){/* 仅在有效画布内更新粘贴落点 */}
  }
  function v18UniqueMainlineText(field, value, selfId=''){
    const base=String(value||'').trim();if(!base)return base;
    const used=new Set((state.mainline?.placed||[]).filter(item=>item.id!==selfId).map(item=>String(item[field]||'').trim()).filter(Boolean));
    if(!used.has(base))return base;
    let index=2,candidate=`${base} ${index}`;while(used.has(candidate)){index++;candidate=`${base} ${index}`;}return candidate;
  }
  function v18CloneMainline(item, dx, dy){
    const copy=clone(item);copy.id=v18NewId();
    if('x' in copy)copy.x=snapCoord(Number(copy.x||0)+dx);
    if('y' in copy)copy.y=snapCoord(Number(copy.y||0)+dy);
    if('x2' in copy)copy.x2=snapCoord(Number(copy.x2||0)+dx);
    if('y2' in copy)copy.y2=snapCoord(Number(copy.y2||0)+dy);
    if(copy.code)copy.code=v18UniqueMainlineText('code',`${copy.code} 副本`);
    if(copy.name)copy.name=v18UniqueMainlineText('name',`${copy.name} 副本`);
    return copy;
  }
  function v18CopyMainline(){
    const item=(state.mainline?.placed||[]).find(row=>row.id===v18MainlineSelectedId);if(!item){toast('请先选择正线对象');return;}
    v18MainlineClipboard=[clone(item)];toast(`已复制：${item.name||item.code||'正线对象'}`);
  }
  function v18PasteMainline(){
    if(!v18MainlineClipboard.length){toast('剪贴板没有正线对象');return;}
    const source=v18MainlineClipboard[0],dx=Number(v18MainlinePoint.x||source.x||0)-Number(source.x||0)+12,dy=Number(v18MainlinePoint.y||source.y||0)-Number(source.y||0)+12;
    const copy=v18CloneMainline(source,dx,dy);state.mainline=state.mainline||{placed:[]};state.mainline.placed.push(copy);state.dirty=true;v18MainlineSelectedId=copy.id;render();requestAnimationFrame(v18PaintMainlineSelection);toast('已粘贴正线对象');
  }
  document.addEventListener('pointerdown',v18TrackPointer,true);
  document.addEventListener('keydown',event=>{
    if(!v18MainlineEditor()||v18Editing()||!event.ctrlKey)return;
    if(event.key.toLowerCase()==='c'){event.preventDefault();event.stopImmediatePropagation();v18CopyMainline();}
    if(event.key.toLowerCase()==='v'){event.preventDefault();event.stopImmediatePropagation();v18PasteMainline();}
  },true);

  function v18AfterResize(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{try{fit();}catch(_){};render();window.dispatchEvent(new Event('resize'));}));
  }
  function v18SyncRuntimeButtons(){
    if(!isRuntime)return;
    const full=document.getElementById('runtimeMapToggle2')||document.getElementById('runtimeMapToggle');
    if(full){full.textContent=document.body.classList.contains('v18-runtime-fullscreen')?'恢复布局':'全屏地图';full.onclick=v18ToggleRuntimeFullscreen;}
    const side=document.getElementById('v18RuntimeSidebars');
    if(side)side.textContent=document.body.classList.contains('v18-runtime-sidebars-hidden')?'显示边栏':'隐藏边栏';
  }
  function v18ToggleRuntimeFullscreen(){
    const next=!document.body.classList.contains('v18-runtime-fullscreen');
    document.body.classList.toggle('v18-runtime-fullscreen',next);
    document.body.classList.remove('runtime-map-expanded');
    v18SyncRuntimeButtons();v18AfterResize();
  }
  function v18ToggleRuntimeSidebars(){
    document.body.classList.toggle('v18-runtime-sidebars-hidden');
    v18SyncRuntimeButtons();v18AfterResize();
  }
  function v18InstallRuntimeControls(){
    if(!isRuntime)return;
    const actions=document.querySelector('.runtime-map-actions')||document.querySelector('.toolbar-right');if(!actions)return;
    if(!document.getElementById('v18RuntimeSidebars')){
      const button=document.createElement('button');button.id='v18RuntimeSidebars';button.type='button';button.textContent='隐藏边栏';button.onclick=v18ToggleRuntimeSidebars;
      const fitButton=document.getElementById('runtimeFitView');if(fitButton)actions.insertBefore(button,fitButton);else actions.appendChild(button);
    }
    v18SyncRuntimeButtons();
  }
  const v18BaseRender=render;
  render=function(){v18BaseRender();if(v18MainlineEditor())v18PaintMainlineSelection();if(isRuntime)v18InstallRuntimeControls();};
  const style=document.createElement('style');style.textContent=`

<script>
/* v19：电客车编组号方向按线路记忆 */
(() => {
  const V19_NORMAL='1A-2A', V19_REVERSED='2A-1A', V19_HIDDEN='none';
  function v19Defaults(){
    runtimeState.vehicleNumberOrderByLine=runtimeState.vehicleNumberOrderByLine||{};
    return runtimeState.vehicleNumberOrderByLine;
  }
  function v19Order(lineId){return v19Defaults()[lineId]||V19_NORMAL;}
  function v19SetOrder(lineId,value){v19Defaults()[lineId]=[V19_NORMAL,V19_REVERSED,V19_HIDDEN].includes(value)?value:V19_NORMAL;}
  function v19OrderOptions(value){return `<option value="${V19_NORMAL}" ${value===V19_NORMAL?'selected':''}>1A-2A</option><option value="${V19_REVERSED}" ${value===V19_REVERSED?'selected':''}>2A-1A</option><option value="${V19_HIDDEN}" ${value===V19_HIDDEN?'selected':''}>不展示</option>`;}

  const v19BaseVehicleLayout=vehicleLayout;
  vehicleLayout=function(vehicle,track){
    const layout=v19BaseVehicleLayout(vehicle,track),order=vehicle?.numberOrder||V19_NORMAL;
    if(order===V19_REVERSED)layout.codes=[...layout.codes].reverse();
    layout.numberOrder=order;layout.showCarCodes=order!==V19_HIDDEN;
    return layout;
  };

  const v19BaseEnhanceVehiclePlacement=enhanceVehiclePlacement;
  enhanceVehiclePlacement=function(){
    v19BaseEnhanceVehiclePlacement();
    const consistWrap=document.getElementById('dialogConsistWrap'),line=document.getElementById('dialogVehicleLine');
    if(!consistWrap||!line||document.getElementById('dialogVehicleNumberOrder'))return;
    const wrap=document.createElement('div');wrap.id='dialogVehicleNumberOrderWrap';
    wrap.innerHTML=`<label>编号排序</label><select id="dialogVehicleNumberOrder">${v19OrderOptions(v19Order(line.value))}</select>`;
    consistWrap.insertAdjacentElement('afterend',wrap);
    const sync=()=>{const requires=document.getElementById('dialogVehicleType')?.selectedOptions[0]?.dataset.requiresConsist==='1';wrap.style.display=requires?'block':'none';const select=document.getElementById('dialogVehicleNumberOrder');if(select&&line)select.value=v19Order(line.value);};
    line.addEventListener('change',sync);document.getElementById('dialogVehicleType')?.addEventListener('change',()=>setTimeout(sync,0));sync();
  };

  const v19BaseHandleTrackAction=handleTrackDialogAction;
  handleTrackDialogAction=function(action){
    if(action!=='addVehicle')return v19BaseHandleTrackAction(action);
    const before=runtimeState.vehicles.length,lineId=document.getElementById('dialogVehicleLine')?.value||state.project.lineId,order=document.getElementById('dialogVehicleNumberOrder')?.value||v19Order(lineId);
    v19BaseHandleTrackAction(action);
    if(runtimeState.vehicles.length<=before)return;
    const vehicle=runtimeState.vehicles.at(-1),type=vehicleTypeById(vehicle.vehicleTypeId);
    if(type?.requiresConsist){vehicle.numberOrder=order;v19SetOrder(lineId,order);} else vehicle.numberOrder=V19_HIDDEN;
    saveRuntime();render();
  };

  /* 运行图仍保留真实的车厢编号，用于安全设备定位；“不展示”仅隐藏车厢内文字。 */
  const v19BaseRuntimeOverlays=drawRuntimeOverlays;
  drawRuntimeOverlays=function(){
    v19BaseRuntimeOverlays();
    (runtimeState.vehicles||[]).filter(vehicle=>vehicle.numberOrder===V19_HIDDEN).forEach(vehicle=>{
      document.querySelectorAll(`[data-kind="runtimeVehicle"][data-id="${CSS.escape(vehicle.id)}"] .consist-label`).forEach(node=>node.remove());
    });
  };
  document.title='线路/场段详图编辑器 v19';
})();

<script>
/* v20：对象唯一编号、右侧属性检查器、单边缩放与运行页安全设备样式。 */
(()=>{
  const V20_RED='#f20202';

  const v20Prefix={
    track:'TRK',line:'LIN',switch:'SWT',signal:'SIG',area:'ARE',vehicle:'VEH',marker:'MRK',text:'TXT',

    crossover:'XOV',turnback:'TBK',camera:'CAM',substation:'SUB',well:'WEL',pump:'PMP',
    lockBoundary:'LKB',eccBoundary:'ECB',isolator:'ISO',sectionPost:'SPS',km:'KM',distance:'DST',gradient:'GRD'
  };
  const v20Esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const v20NoPrefix=type=>v20Prefix[type]||'OBJ';
  const v20AllObjects=()=>{
    const rows=[];
    /* 旧写法保留为注释，避免嵌套回调导致的括号错误。
    Object.entries(state.objects||{}).forEach(([key,list])=>Array.isArray(list)&&list.forEach(o=>rows.push({o,type:o.type||key.replace(/s$/,''}))));
    */

  function v20ShowMainlineInspector(id){

        <div><label>${isLine?'线条颜色':'轮廓颜色'}</label><div class="color-control"><input id="v20ObjectColor" type="color" value="${v20Esc(o.color||'#dff8ff')}"><span class="rgb-value" id="v20ObjectRgb">${hexRgb(o.color||'#dff8ff')}</span></div></div>
        <div><label>${isLine?'线条粗细（px）':'轮廓宽度（px）'}</label><input id="v20ObjectWidth" type="number" min="0.5" max="36" step="0.5" value="${Number(o.width||2)}"></div>
        ${isLine?`<div><label>线型</label><select id="v20ObjectLineStyle"><option value="solid" ${o.lineStyle!=='dashed'?'selected':''}>实线</option><option value="dashed" ${o.lineStyle==='dashed'?'selected':''}>虚线</option></select></div>`:''}

        ${!isLine?`<div><label>图标尺寸（px）</label><input id="v20ObjectIconSize" type="number" min="6" max="300" value="${Number(o.iconSize||28)}"></div>`:''}
        <div><label>字体</label><select id="v20ObjectFontFamily"><option value="Microsoft YaHei" ${(o.fontFamily||'Microsoft YaHei')==='Microsoft YaHei'?'selected':''}>微软雅黑</option><option value="SimSun" ${o.fontFamily==='SimSun'?'selected':''}>宋体</option><option value="SimHei" ${o.fontFamily==='SimHei'?'selected':''}>黑体</option><option value="Arial" ${o.fontFamily==='Arial'?'selected':''}>Arial</option></select></div>
        <div><label>文字字号</label><input id="v20ObjectFontSize" type="number" min="6" max="80" value="${Number(o.fontSize||14)}"></div>

      </div>

      o.fontFamily=document.getElementById('v20ObjectFontFamily').value;o.fontSize=Math.max(6,Number(document.getElementById('v20ObjectFontSize').value)||14);o.fontWeight=Number(document.getElementById('v20ObjectFontWeight').value)||400;
      if(isStation){o.stationId=document.getElementById('v20ObjectStation').value;o.fillColor=fill.value;o.fillOpacity=Number(document.getElementById('v20ObjectFillOpacity').value)||0;}
      if(['well','pump'].includes(o.type)){o.fillColor=fill.value;o.fillOpacity=Number(document.getElementById('v20ObjectFillOpacity').value)||0;}
      if(isLine)o.lineStyle=document.getElementById('v20ObjectLineStyle').value;else o.iconSize=Math.max(6,Number(document.getElementById('v20ObjectIconSize').value)||28);
      state.dirty=true;render();toast('属性已应用');
    };
    document.getElementById('v20DeleteMainline').onclick=()=>{state.mainline.placed=state.mainline.placed.filter(item=>item.id!==id);v20MainlineSelectedId='';state.dirty=true;render();toast('对象已删除');};
  }
  window.v20OpenMainlineInspector=v20ShowMainlineInspector;

  const v20BaseRenderProps=renderProps;
  renderProps=function(){

    if(v20IsMainline())return;
    const o=typeof selectedObj==='function'?selectedObj():null,grid=document.querySelector('#propertyPanel .grid2');

  function v20UpdateStationDom(o){

  function v20DrawStationHandles(o){

<script>

(()=>{
  const V23_RED='#f20202';
  if(!isRuntime){state.schemaVersion='yard-map-v23';state.project={...(state.project||{}),version:'v23'};}
  const v23Esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const v23Type=vehicle=>vehicleTypeById(vehicle?.vehicleTypeId);
  const v23RequiresConsist=vehicle=>v23Type(vehicle)?.requiresConsist??((vehicle?.vehicleType||'电客车')==='电客车');
  const v23MarkerKind=marker=>{

  };

    const span=requires?Math.min(.68,Math.max(.18,consist*.11)):Math.min(.22,Math.max(.08,42/total));
    const center=Math.max(span/2+.025,Math.min(1-span/2-.025,Number(vehicle?.ratio??.5)));
    const width=total*span,height=requires?Math.max(10,Math.min(16,total*.018)):12;

  }
  function v23LabelStyle(vehicle,width,height){

<script>
/*
 * v33 全屏作业同步、图例交互和安全设备落点优化：
 * - 全屏页的每一次确认操作沿用运行状态本机存储；编辑页新增“同步运行状态”，读取后提供只读预览和汇总。
 * - 图例收起后以边缘标签呈现，展开未固定时在 10 秒无交互后自动收起；所有控制使用直接事件，避免多层弹框事件造成点击不灵敏。
 * - 列车外形改为 SVG 后，安全设备按列车图标两端重新定位：红闪灯和止轮器位于车体外侧且在股道线上，禁动牌保持在车体两端。
 */
(()=>{
  const V33_AUTO_HIDE=10000;
  let v33LegendTimer=0;
  const v33Esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  function v33LegendState(){runtimeState.legendUi={hidden:false,pinned:true,...(runtimeState.legendUi||{})};return runtimeState.legendUi;}
  function v33SetLegendState(patch){runtimeState.legendUi={...v33LegendState(),...patch};saveRuntime();render();}
  function v33ClearLegendTimer(){if(v33LegendTimer){clearTimeout(v33LegendTimer);v33LegendTimer=0;}}
  function v33ScheduleLegendHide(){v33ClearLegendTimer();if(v33LegendState().pinned||v33LegendState().hidden)return;v33LegendTimer=setTimeout(()=>v33SetLegendState({hidden:true}),V33_AUTO_HIDE);}
  function v33ApplyLegend(){
    const box=document.getElementById('runtimeMapLegend');if(!box||!isRuntime)return;

    const clear=document.getElementById('clearAll');if(clear)clear.onclick=()=>{if(confirm('确认清空当前图纸？'))publicResetEditor();};
  }
  /* 后续的历史兼容脚本仍可能异步触发 render；每次重绘后恢复公开版可见名称与入口。 */
  const publicBaseRender=render;
  render=function(){publicBaseRender();publicBrand();};
  window.publicYardOnlyEntry=publicYardOnlyEntry;
  /* 历史脚本会在加载过程中先创建登录/首页；在下一帧统一接管，避免页面闪现多入口。 */
  requestAnimationFrame(publicYardOnlyEntry);
})();

</script>
</body>
</html>
